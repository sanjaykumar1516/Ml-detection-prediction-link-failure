services:
  backend:
    build: ./backend
    networks:
      leo_net:
        aliases: [backend]
    ports:
      - "8000:8000"
    volumes:
      - satellite_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
  frontend:
    build: ./frontend
    networks: [leo_net]
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
volumes:
  satellite_data:
  frontend_node_modules:

networks:
  leo_net:
    driver: bridge
